<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shipment | TransportFlow ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-dark: #2c3e50; }
        .form-label { font-size: 0.85rem; font-weight: bold; color: #555; }
        .card { border-radius: 12px; overflow: hidden; }
        .btn-update { background-color: #27ae60; color: white; font-weight: bold; }
        .btn-update:hover { background-color: #219150; color: white; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
                <i class="fas fa-truck-loading text-warning me-2"></i> TransportFlow ERP
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0"><i class="fas fa-edit me-2"></i> Update Shipment Details</h5>
                        <small class="opacity-75">Bilty Number: {{ shipment.bilty_number }}</small>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            
                            <div class="row g-4">
                                {% for field in form %}
                                <div class="col-md-4">
                                    <label class="form-label">{{ field.label }}</label>
                                    <div class="input-group">
                                        {{ field }}
                                    </div>
                                    {% if field.errors %}
                                        <div class="text-danger small">{{ field.errors }}</div>
                                    {% endif %}
                                </div>
                                {% endfor %}
                            </div>

                            <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">
                                    <i class="fas fa-arrow-left me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-update px-5 shadow-sm">
                                    <i class="fas fa-save me-1"></i> Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-4 text-muted small">&copy; 2026 TransportFlow ERP | Secure Management</p>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('input, select, textarea').forEach(function(el) {
            el.classList.add('form-control');
            if (el.type === 'checkbox') {
                el.classList.remove('form-control');
                el.classList.add('form-check-input');
            }
        });
    </script>
</body>
</html>
