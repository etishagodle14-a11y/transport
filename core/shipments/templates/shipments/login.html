<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TransportFlow ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #1a252f; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold"><i class="fas fa-truck-loading text-warning me-2"></i>TransportFlow</h2>
                    <p class="text-muted small text-uppercase fw-bold">Management Login</p>
                </div>
                
                <div class="card login-card p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Invalid username or password.
                        </div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login to ERP</button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <p class="small mb-0">New Staff? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Create Account</a></p>
                    </div>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}" class="text-muted small text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Public View</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
