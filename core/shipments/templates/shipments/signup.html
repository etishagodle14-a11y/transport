<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - TransportFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .signup-card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        /* Django default forms ko style karne ke liye helper */
        form p label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: #555; }
        form p input { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 5px; margin-bottom: 15px; }
        .helptext { font-size: 0.7rem; color: #888; display: block; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card signup-card p-4">
                    <h4 class="fw-bold mb-4 text-center"><i class="fas fa-user-plus text-primary me-2"></i>Staff Registration</h4>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Register Account</button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <p class="small">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
